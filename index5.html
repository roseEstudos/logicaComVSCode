<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 06 - JS</title>
</head>
<body>
    <h2>JS Statement</h2>

    <p>A <b>JS program</b> is a list of <b>statements</b> to be executed by a computer.</p>

    <p id="demo"></p>

    <script>
        let x, y, z;
        x = 5;
        y = 9;
        z = x + y;
        document.getElementById("demo").innerHTML = "O resultado de z é: " + z + ".";
    </script>
</body>
</html>
